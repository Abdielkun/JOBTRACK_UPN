services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jobtrack
      POSTGRES_USER: jobtrack
      POSTGRES_PASSWORD: jobtrack_local
    ports:
      - "5432:5432"
    volumes:
      - jobtrack_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtrack"]
      interval: 5s
      retries: 10
volumes:
  jobtrack_data:
